

synthetic_data:
  n_leads: 5000
  simulation_days: 180        

  random_seed: 42


  sources:
    organic: 1.2
    referral: 1.6
    event: 1.3
    paid_search: 1.0
    cold_outreach: 0.6

 
  budget_tiers:
    low: 0.5
    mid: 1.0
    enterprise: 1.4

 
  company_size_lognormal_mean: 3.0    
  company_size_lognormal_sigma: 1.1

 
  true_intent_lognormal_mean: 0.0
  true_intent_lognormal_sigma: 0.7

 
  event_type_weights:
    email_open: 5.0
    email_click: 2.0
    website_visit: 2.5
    form_fill: 0.8
    demo_request: 0.3

 
  baseline_total_events: 8.0

  
  conversion_logistic_steepness: 1.4

 
  conversion_logistic_intercept: -2.2

cleaning:
  
  min_events_required: 0   
                            

feature_engineering:
 
  too_new_days_threshold: 3

segmentation:
  n_clusters: 4
  random_state: 42
  n_init: 10
  clustering_features:
    - "total_events"
    - "demo_requests"
    - "days_since_last_engagement"
    - "engagement_velocity"

scoring:
  test_size: 0.2
  random_state: 42
  n_estimators: 200
  max_depth: 8

recommendations:
  hot_score_threshold: 70
  warm_score_threshold: 40
 
  unqualified_budget_tier: "low"
  unqualified_company_size_floor: 5   

app:
  data_mode_default: "demo"
  demo_max_rows: 2000
  demo_csv_path: "data/demo_sample.csv"
